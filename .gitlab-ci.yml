stages:
  - check
  - test_api
  - build_api
  - build_front

lint_code:
  stage: check
  image: python:3.10-slim
  script:
    - pip install flake8
    - flake8 . --exclude=venv

test_api:
  stage: test_api
  image: python:3.10-slim
  script:
    - pip install -r api/requirements.txt
    - python api/test_main.py

build_api:
  stage: build_api
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" ./api
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

build_front:
  stage: build_front
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" ./front-end-nextjs
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
