stages:
  - check
  - test
  - build
  - deploy

default:
  tags:
    - qr

lint_code:
  stage: check
  image: python:3.10-slim
  script:
    - pip install flake8
    - flake8 . --exclude=venv

test_api:
  stage: test
  image: python:3.10-slim
  script:
    - pip install -r api/requirements.txt
    - python api/test_main.py

build_api:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" ./api
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"

build_front:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >-
      docker build
      --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      -t $CI_REGISTRY_IMAGE/front:$CI_COMMIT_SHA
      ./front-end-nextjs
    - docker push $CI_REGISTRY_IMAGE/front:$CI_COMMIT_SHA

deploy:
  stage: deploy
  image:
    name: alpine/k8s:1.30.0
    entrypoint: [""]
  before_script:
    - kubectl create secret docker-registry gitlab-registry-secret
        --docker-server=$CI_REGISTRY
        --docker-username=$CI_DEPLOY_USER
        --docker-password=$CI_DEPLOY_PASSWORD
        --dry-run=client -o yaml | kubectl apply -f -
  script:
    - kubectl cluster-info
    - kubectl apply -f k8s/configmap.yml
    - kubectl apply -f k8s/fastapi_service.yml
    - kubectl apply -f k8s/frontend_service.yml
    - kubectl apply -f k8s/gatewayapi.yml
    - kubectl apply -f k8s/http-route.yml
    - envsubst < k8s/fastapi_deployment.yml | kubectl apply -f -
    - envsubst < k8s/frontend_deployment.yml | kubectl apply -f -
    - kubectl rollout status deployment/fastapi --timeout=120s
    - kubectl rollout status deployment/frontend --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
